services:
  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
      target: development
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - .:/app                          # workspace root → hot-reload picks up changes
      - /app/node_modules               # preserve container's root node_modules
      - /app/apps/api/node_modules      # preserve container's api node_modules
      - /app/apps/api/dist              # isolate dist — container owns it, avoids permission errors
    networks: [quizblitz_network]

  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER}", "-d", "${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [quizblitz_network]

  pgadmin:
    image: dpage/pgadmin4
    env_file:
      - .env
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped
    networks: [quizblitz_network]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${R2_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${R2_SECRET_ACCESS_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [quizblitz_network]

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - .env
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${R2_ACCESS_KEY_ID} $${R2_SECRET_ACCESS_KEY} &&
      mc mb --ignore-existing local/$${R2_BUCKET_NAME} &&
      mc anonymous set public local/$${R2_BUCKET_NAME} &&
      echo 'MinIO bucket ready'
      "
    restart: "no"
    networks: [quizblitz_network]

  mailpit:
    image: axllent/mailpit:v1.30
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web inbox
    restart: unless-stopped
    networks: [quizblitz_network]

volumes:
  postgres_data:
  minio_data:

networks:
  quizblitz_network:
    driver: bridge
